; K3NG Rotator Controller - port a ESP32 (WROOM-32) con WiFi, servidor web y BNO055
;
; El firmware sigue siendo un sketch Arduino (.ino); PlatformIO lo compila
; directamente desde la carpeta k3ng_rotator_controller/.
; La selección de hardware se hace con -DHARDWARE_ESP32_WIFI, que incluye
; rotator_features_esp32.h, rotator_pins_esp32.h y rotator_settings_esp32.h.

[platformio]
src_dir = k3ng_rotator_controller
lib_dir = libraries
default_envs = esp32

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 9600
monitor_filters = esp32_exception_decoder
build_flags =
	-DHARDWARE_ESP32_WIFI
	; WiFi incluye "Network.h" entre comillas y el buscador de dependencias no lo resuelve
	-I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src
build_src_filter = +<*> -<Nextion/> -<rotator_k3ngdisplay.cpp>   ; sin pantalla LCD en este hardware
lib_ldf_mode = chain+
; Librerías del core que el buscador de dependencias no resuelve solo (WiFi -> Networking)
lib_deps =
	Networking
	WiFi
	ESPmDNS
	WebServer
	FS
	Preferences
	adafruit/Adafruit BNO055
	adafruit/Adafruit Unified Sensor
	adafruit/Adafruit BusIO
